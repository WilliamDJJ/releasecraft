name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install setuptools wheel .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_distributions.py --output ../releasecraft-artifacts
      - if: runner.os == 'Linux'
        run: python scripts/check_distribution.py --archive ../releasecraft-artifacts/releasecraft-1.1.0-linux.tar.gz --trust-distribution
      - if: runner.os == 'Windows'
        run: python scripts/check_distribution.py --archive ../releasecraft-artifacts/releasecraft-1.1.0-windows.zip --trust-distribution
